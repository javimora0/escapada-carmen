<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una sorpresa para ti ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="stars"></div>

    <main class="welcome">

        <div class="welcome-content">

            <p class="eyebrow">
                Para ti
            </p>

            <h1>
                He preparado<br>
                algo para ti <span>♥</span>
            </h1>

            <div class="separator"></div>

            <p class="subtitle">
                Pero tendrás que descubrirlo...
            </p>

            <div class="challenge">

                <p>
                    Hay una pequeña condición.
                </p>

                <span>
                    No puedes pedir pistas a nadie. 🤫
                </span>

            </div>

            <button id="startButton">
                <span>¿Aceptas el reto?</span>
                <strong>→</strong>
            </button>

            <p class="hint">
                Toca para comenzar
            </p>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
